services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-folio_root}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-folio}"
      MYSQL_USER: "${MYSQL_USER:-folio}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-folio_pass}"
      TZ: "${TZ:-Asia/Shanghai}"
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" --silent']
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmjs.org}"
        GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      FOLIO_ADDR: ":8080"
      FOLIO_WEB: "/app/web/dist"
      FOLIO_DB_DRIVER: "mysql"
      FOLIO_MYSQL_DSN: "${FOLIO_MYSQL_DSN:-folio:folio_pass@tcp(db:3306)/folio?charset=utf8mb4&parseTime=True&loc=Local}"
      TZ: "${TZ:-Asia/Shanghai}"
      FOLIO_STORAGE: "${FOLIO_STORAGE:-local}"
      FOLIO_UPLOAD_DIR: "/app/data/uploads"
      FOLIO_QINIU_ACCESS_KEY: "${FOLIO_QINIU_ACCESS_KEY:-}"
      FOLIO_QINIU_SECRET_KEY: "${FOLIO_QINIU_SECRET_KEY:-}"
      FOLIO_QINIU_BUCKET: "${FOLIO_QINIU_BUCKET:-}"
      FOLIO_QINIU_DOMAIN: "${FOLIO_QINIU_DOMAIN:-}"
      FOLIO_QINIU_REGION: "${FOLIO_QINIU_REGION:-}"
      FOLIO_QINIU_PREFIX: "${FOLIO_QINIU_PREFIX:-folio}"
      FOLIO_REDIS_ADDR: "redis:6379"
      FOLIO_AI_API_KEY: "${FOLIO_AI_API_KEY:-}"
      FOLIO_AI_MODEL: "${FOLIO_AI_MODEL:-claude-opus-5-5}"
      FOLIO_AI_BASE_URL: "${FOLIO_AI_BASE_URL:-}"
      FOLIO_DEEPSEEK_BASE_URL: "${FOLIO_DEEPSEEK_BASE_URL:-}"
      FOLIO_GLM_BASE_URL: "${FOLIO_GLM_BASE_URL:-}"
      FOLIO_KIMI_BASE_URL: "${FOLIO_KIMI_BASE_URL:-}"
      FOLIO_QWEN_BASE_URL: "${FOLIO_QWEN_BASE_URL:-}"
      FOLIO_SMTP_HOST: "${FOLIO_SMTP_HOST:-}"
      FOLIO_SMTP_PORT: "${FOLIO_SMTP_PORT:-587}"
      FOLIO_SMTP_USER: "${FOLIO_SMTP_USER:-}"
      FOLIO_SMTP_PASSWORD: "${FOLIO_SMTP_PASSWORD:-}"
      FOLIO_SMTP_FROM: "${FOLIO_SMTP_FROM:-}"
      FOLIO_SMTP_FROM_NAME: "${FOLIO_SMTP_FROM_NAME:-}"
      FOLIO_SMTP_TLS: "${FOLIO_SMTP_TLS:-}"
      FOLIO_MAIL_DEBUG: "${FOLIO_MAIL_DEBUG:-0}"
      FOLIO_LOGIN_CAPTCHA: "${FOLIO_LOGIN_CAPTCHA:-0}"
      FOLIO_CAPTCHA_DEBUG: "${FOLIO_CAPTCHA_DEBUG:-0}"
      FOLIO_QQ_APP_ID: "${FOLIO_QQ_APP_ID:-}"
      FOLIO_QQ_APP_KEY: "${FOLIO_QQ_APP_KEY:-}"
      FOLIO_QQ_REDIRECT: "${FOLIO_QQ_REDIRECT:-}"
      FOLIO_WEB_URL: "${FOLIO_WEB_URL:-}"
      FOLIO_SECRET: "${FOLIO_SECRET:?请先在 .env 设置至少 32 个字符的 FOLIO_SECRET}"
      FOLIO_DEMO: "${FOLIO_DEMO:-0}"
      FOLIO_ADMIN_USERNAME: "${FOLIO_ADMIN_USERNAME:-}"
      FOLIO_ADMIN_PASSWORD: "${FOLIO_ADMIN_PASSWORD:-}"
      FOLIO_TRUSTED_PROXIES: "${FOLIO_TRUSTED_PROXIES:-}"
      FOLIO_SITE_URL: "${FOLIO_SITE_URL:-}"
      FOLIO_SITE_NAME: "${FOLIO_SITE_NAME:-知微}"
      FOLIO_SITE_DESC: "${FOLIO_SITE_DESC:-}"
      FOLIO_SITE_OWNER: "${FOLIO_SITE_OWNER:-weijia}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - uploads-data:/app/data/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
  redis-data:
  uploads-data:
